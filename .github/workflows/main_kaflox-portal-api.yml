# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - kaflox-portal-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gunicorn whitenoise

      - name: Collect static files
        env:
            SECRET_KEY: ${{ secrets.SECRET_KEY }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python manage.py collectstatic --noinput

      - name: Create deployment package
        run: |
          mkdir -p deployment_package
          # Copy only necessary files
          cp -r kaflox_portal deployment_package/
          cp -r staticfiles deployment_package/ 2>/dev/null || true
          cp manage.py deployment_package/
          cp requirements.txt deployment_package/
          cp -r static deployment_package/ 2>/dev/null || true
          cp -r templates deployment_package/ 2>/dev/null || true
          # Create a proper zip
          cd deployment_package
          zip -r ../app.zip . -x "*.pyc" "__pycache__*" "*.db"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9F75F1015BC84579B64FC6DD4B26989F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_51100D882833446580FDBEBB648577A9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A7A859C316614630B1986F99783A8003 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'kaflox-portal-api'
          slot-name: 'Production'
          package: './app.zip'
          startup-command: 'gunicorn --bind=0.0.0.0 --timeout 600 kaflox_portal.wsgi:application'